name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests hors ligne
        run: python -m unittest discover -s tests -v
      - name: Rapport sur l'exemple fictif
        run: python surface.py --from-file examples/reponse-fictive.txt --no-color || test $? -eq 1
