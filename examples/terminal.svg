<svg xmlns="http://www.w3.org/2000/svg" width="860" height="536" viewBox="0 0 860 536" role="img" aria-label="Sortie de Surface sur une réponse HTTP fictive">
<rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="430" y="25" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">surface-audit</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
<text x="22" y="52" fill="#8b949e" xml:space="preserve">$ python3 surface.py --from-file examples/reponse-fictive.txt</text>
<text x="22" y="92" fill="#c9d1d9" xml:space="preserve">Surface 1.0.0 — exemple fictif (HTTP 200)</text>
<text x="22" y="132" xml:space="preserve"><tspan fill="#ff6b5e" font-weight="700">[PRIORITAIRE]</tspan><tspan fill="#e6edf3">  Cookie « PHPSESSID »</tspan></text>
<text x="22" y="152" fill="#8b949e" xml:space="preserve">   Attribut(s) manquant(s) : HttpOnly, SameSite.</text>
<text x="22" y="172" xml:space="preserve"><tspan fill="#f2c14e" font-weight="700">[À VÉRIFIER]</tspan><tspan fill="#e6edf3">   HSTS</tspan></text>
<text x="22" y="192" fill="#8b949e" xml:space="preserve">   max-age=86400 s, soit moins de six mois.</text>
<text x="22" y="212" xml:space="preserve"><tspan fill="#f2c14e" font-weight="700">[À VÉRIFIER]</tspan><tspan fill="#e6edf3">   Politique de contenu (CSP)</tspan></text>
<text x="22" y="232" fill="#8b949e" xml:space="preserve">   CSP présente mais permissive : &#x27;unsafe-inline&#x27; sans nonce ni hash.</text>
<text x="22" y="252" xml:space="preserve"><tspan fill="#f2c14e" font-weight="700">[À VÉRIFIER]</tspan><tspan fill="#e6edf3">   Protection contre le clickjacking</tspan></text>
<text x="22" y="272" fill="#8b949e" xml:space="preserve">   Ni frame-ancestors ni X-Frame-Options valide.</text>
<text x="22" y="292" xml:space="preserve"><tspan fill="#f2c14e" font-weight="700">[À VÉRIFIER]</tspan><tspan fill="#e6edf3">   Referrer-Policy</tspan></text>
<text x="22" y="312" fill="#8b949e" xml:space="preserve">   En-tête absent : le navigateur applique sa valeur par défaut.</text>
<text x="22" y="332" xml:space="preserve"><tspan fill="#f2c14e" font-weight="700">[À VÉRIFIER]</tspan><tspan fill="#e6edf3">   Informations sur la pile technique</tspan></text>
<text x="22" y="352" fill="#8b949e" xml:space="preserve">   Versions exposées — Server: nginx/1.18.0 ; X-Powered-By: PHP/7.4.3.</text>
<text x="22" y="372" xml:space="preserve"><tspan fill="#5fd38d" font-weight="700">[OK]</tspan><tspan fill="#e6edf3">           HTTPS</tspan></text>
<text x="22" y="392" fill="#8b949e" xml:space="preserve">   Page servie en HTTPS (https://exemple.invalid/).</text>
<text x="22" y="412" xml:space="preserve"><tspan fill="#5fd38d" font-weight="700">[OK]</tspan><tspan fill="#e6edf3">           X-Content-Type-Options</tspan></text>
<text x="22" y="432" fill="#8b949e" xml:space="preserve">   nosniff présent.</text>
<text x="22" y="452" fill="#8b949e" xml:space="preserve">   …</text>
<text x="22" y="492" fill="#c9d1d9" xml:space="preserve">1 prioritaire · 5 à vérifier · 4 ok · 2 non évalué</text>
</g></svg>